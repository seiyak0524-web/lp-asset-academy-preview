<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>【完全無料】年商1億を資産10億へ。女性起業家のための資産形成完全ロードマップ オンライン勉強会</title>
<meta name="description" content="事業利益を資産に変える、女性起業家のための資産形成完全ロードマップ。完全無料オンライン勉強会を開催中！最大30大特典プレゼント中。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;600;700;900&family=Zen+Kurenaido&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* ============================================================
   女性起業家の資産10億アカデミー 勉強会LP
   メインカラー: #D33667 / ゴールド / クリーム
   ※CTAリンクは <a class="cta-link"> の href を
     勉強会LINE登録URLに一括置換してください
============================================================ */
:root{
  --main:#D33667;
  --deep:#B71E4E;
  --wine:#8A1538;
  --pink-bg:#FCE9EE;
  --pink-soft:#FDF2F4;
  --cream:#FBF6EE;
  --gold-d:#9C6A14;
  --gold-m:#C49A3C;
  --gold-l:#F0DCA8;
  --ink:#3A3034;
  --serif:'Noto Serif JP',serif;
  --sans:'Noto Sans JP',sans-serif;
  --hand:'Zen Kurenaido',sans-serif;
  --script:'Pinyon Script',cursive;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{background:#EDE4DC;font-family:var(--sans);color:var(--ink);line-height:1.8;}
img{max-width:100%;display:block;}
a{text-decoration:none;color:inherit;}
#lp{max-width:750px;margin:0 auto;background:#fff;box-shadow:0 0 24px rgba(60,30,40,.25);overflow:hidden;}

/* ---------- 共通パーツ ---------- */
.inner{padding:0 5%;}
.serif{font-family:var(--serif);}
.red{color:var(--main);}
.gold-txt{
  background:linear-gradient(105deg,#8A5C10 0%,#C99B33 25%,#F2DFA7 48%,#B8862B 70%,#E9CC82 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.marker{background:linear-gradient(transparent 62%,#F9E48E 62%);}

/* 緑CTAボタン */
.cta-wrap{padding:10px 6% 14px;}
.cta-img{width:100%;height:auto;display:block;}
.cta-btn{
  display:block;position:relative;text-align:center;
  background:linear-gradient(180deg,#62DCA4 0%,#19B57A 45%,#0B9B64 100%);
  border-radius:16px;padding:16px 10px 18px;
  box-shadow:0 6px 14px rgba(10,120,80,.35),inset 0 2px 3px rgba(255,255,255,.55),inset 0 -4px 6px rgba(0,80,50,.25);
  animation:btn-shake 3.2s ease-in-out infinite;
}
.cta-btn .cta-sub{
  display:block;color:#FFF8DC;font-weight:700;font-size:clamp(13px,3.4vw,17px);
  letter-spacing:.06em;text-shadow:0 1px 2px rgba(0,90,60,.4);
}
.cta-btn .cta-main{
  display:block;color:#fff;font-weight:900;font-size:clamp(22px,6vw,33px);
  letter-spacing:.04em;line-height:1.35;text-shadow:0 2px 3px rgba(0,90,60,.45);
}
.cta-btn .cta-main::after{content:"▶";font-size:.6em;margin-left:.4em;vertical-align:.15em;}
@keyframes btn-shake{
  0%,86%,100%{transform:translateX(0);}
  88%{transform:translateX(-4px);}
  90%{transform:translateX(4px);}
  92%{transform:translateX(-4px);}
  94%{transform:translateX(4px);}
  96%{transform:translateX(0);}
}

/* 金の下向き矢印 */
.gold-arrow{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 0;}
.gold-arrow span{
  width:120px;height:34px;
  background:linear-gradient(105deg,#B8862B,#F2DFA7 45%,#C49A3C);
  clip-path:polygon(0 0,50% 100%,100% 0,50% 42%);
}
.gold-arrow span:last-child{opacity:.55;width:96px;height:27px;}

/* ドット遷移 */
.dots{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0 36px;}
.dots i{width:13px;height:13px;border-radius:50%;background:#fff;opacity:.95;}

/* ============================================================
   1. ファーストビュー
============================================================ */
.fv a{display:block;}

/* ============================================================
   2. 特典セクション
============================================================ */
.tokuten{
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.5) 0 6px,transparent 7px),
    radial-gradient(circle at 88% 30%,rgba(255,255,255,.45) 0 5px,transparent 6px),
    radial-gradient(circle at 8% 70%,rgba(255,255,255,.4) 0 4px,transparent 5px),
    radial-gradient(circle at 92% 84%,rgba(255,255,255,.4) 0 6px,transparent 7px),
    linear-gradient(180deg,#FBDFE6 0%,#FCE9EE 40%,#FBDDE5 100%);
  padding:0 0 40px;
}
.tokuten-line-img{width:100%;height:auto;display:block;}
.ribbon{
  position:relative;width:fit-content;margin:0 auto 26px;
  background:linear-gradient(180deg,#C9244F,#A8123C);
  color:#fff;font-family:var(--serif);font-weight:700;
  font-size:clamp(21px,5.6vw,32px);letter-spacing:.12em;
  padding:10px 34px;border-radius:6px;
  box-shadow:0 4px 10px rgba(150,20,60,.3);
}
.ribbon::before,.ribbon::after{
  content:"";position:absolute;top:8px;width:30px;height:78%;
  background:linear-gradient(180deg,#A8123C,#8A0D30);z-index:-1;
}
.ribbon::before{left:-20px;transform:skewY(-14deg);clip-path:polygon(0 0,100% 0,100% 100%,0 100%,38% 50%);}
.ribbon::after{right:-20px;transform:skewY(14deg);clip-path:polygon(0 0,100% 0,62% 50%,100% 100%,0 100%);}
.tokuten-lead{
  text-align:center;font-family:var(--serif);font-weight:700;
  color:var(--wine);font-size:clamp(16px,4.4vw,24px);line-height:1.7;letter-spacing:.04em;
}
.tokuten-max{
  text-align:center;font-family:var(--serif);font-weight:900;
  font-size:clamp(33px,9vw,54px);line-height:1.3;margin:10px 0 4px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tokuten-max .laurel{width:clamp(34px,9vw,52px);flex-shrink:0;}
.tokuten-max .laurel.r{transform:scaleX(-1);}
.tokuten-max em{font-style:normal;font-size:1.35em;letter-spacing:.02em;}
.get-bar{
  width:min(92%,560px);margin:18px auto 14px;text-align:center;
  background:linear-gradient(105deg,#C9244F,#E0577E 55%,#C9244F);
  border:1px solid #F0DCA8;outline:3px solid transparent;
  color:#fff;font-family:var(--serif);font-weight:700;
  font-size:clamp(20px,5.4vw,30px);letter-spacing:.1em;
  padding:12px 8px;box-shadow:0 4px 10px rgba(150,20,60,.25);
}
/* 3形式の説明バー */
.fmt-legend{
  width:min(92%,560px);margin:0 auto 24px;text-align:center;
  font-size:clamp(12px,3.3vw,15px);font-weight:700;color:var(--wine);line-height:1.9;
}
.fmt-legend .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px;}
.bk-grid{
  width:min(94%,640px);margin:0 auto;background:#fff;border-radius:14px;
  padding:30px 4% 24px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:30px 14px;box-shadow:0 6px 18px rgba(180,80,110,.18);
}
@media(max-width:430px){.bk-grid{grid-template-columns:repeat(2,1fr);}}

/* ============================================================
   特典モックアップ（冊子・ビデオ・オーディオの3形式）
============================================================ */
.bk-item,.pr-item{display:flex;flex-direction:column;align-items:center;}
.mock-cell{
  display:flex;align-items:center;justify-content:center;width:100%;
}
.mk-img{
  width:100%;max-width:200px;height:auto;display:block;
  background:#fff;border:1px solid #F0D4DC;border-radius:12px;
  box-shadow:0 4px 12px rgba(180,80,110,.16);
}
.video-mock2{margin:0 auto 18px;width:min(94%,460px);}
.video-mock2 img{width:100%;}
/* ---- 提供形式チップ ---- */
.fmt{
  display:inline-flex;align-items:center;gap:4px;
  border-radius:999px;color:#fff;font-weight:700;
  font-size:11px;letter-spacing:.08em;line-height:1;
  padding:5px 12px;box-shadow:0 2px 5px rgba(120,40,60,.25);
}
.fmt::before{font-size:11px;line-height:1;}
.fmt-book{background:linear-gradient(105deg,#D33667,#C9244F);}
.fmt-book::before{content:"📖";}
.fmt-video{background:linear-gradient(105deg,#8A1538,#6E1030);}
.fmt-video::before{content:"🎬";}
.fmt-audio{background:linear-gradient(105deg,#B8862B,#9C6A14);}
.fmt-audio::before{content:"🎧";}

/* ---- 冊子形式（写真入りブック装丁） ---- */
.mk-book{
  position:relative;width:138px;height:200px;flex-shrink:0;
  border-radius:3px 9px 9px 3px;
  transform:perspective(900px) rotateY(-11deg);
  box-shadow:7px 10px 18px rgba(90,40,55,.38);
  display:flex;flex-direction:column;overflow:hidden;
}
.mk-book::before{ /* 背表紙の影 */
  content:"";position:absolute;left:0;top:0;bottom:0;width:9px;z-index:6;
  background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.22) 55%,rgba(0,0,0,.08));
}
.mk-book::after{ /* 小口（ページ） */
  content:"";position:absolute;right:0;top:2.5%;bottom:2.5%;width:7px;z-index:6;
  background:repeating-linear-gradient(180deg,#fff 0 2px,#D8CFC4 2px 3px);
  border-radius:0 6px 6px 0;
}
.mk-book .mb-band{
  font-size:9px;font-weight:700;letter-spacing:.08em;text-align:center;
  padding:5px 4px 4px;line-height:1.35;position:relative;z-index:2;
}
.mk-book .mb-title{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:14px;line-height:1.5;
  letter-spacing:.02em;text-align:center;padding:4px 10px 4px 14px;position:relative;z-index:2;
}
.mk-book .mb-photo{
  position:relative;height:43%;flex-shrink:0;
  border-top:2px solid;overflow:hidden;background:#F5F2EF;
}
.mk-book .mb-photo img{
  width:100%;height:100%;object-fit:cover;object-position:50% 12%;
}
.mk-book .mb-photo i{
  position:absolute;left:0;bottom:0;font-style:normal;
  font-size:8.5px;font-weight:700;letter-spacing:.14em;line-height:1;
  padding:4px 9px 4px 11px;color:#fff;
  background:linear-gradient(105deg,rgba(138,21,56,.94),rgba(201,36,79,.94));
  border-radius:0 8px 0 0;
}
/* ブック配色4種 */
.mk-book.t1{background:linear-gradient(160deg,#C9244F 0%,#A8123C 60%,#8A0D30 100%);}
.mk-book.t1 .mb-band{background:linear-gradient(105deg,#B8862B,#F2DFA7 50%,#C49A3C);color:#6B4A0C;}
.mk-book.t1 .mb-title{color:#fff;}
.mk-book.t1 .mb-photo{border-color:#E3C26B;}
.mk-book.t2{background:linear-gradient(165deg,#FFFDF8 0%,#FAF0DC 60%,#F1E0BC 100%);}
.mk-book.t2 .mb-band{background:linear-gradient(105deg,#C9244F,#E0577E);color:#fff;}
.mk-book.t2 .mb-title{color:#8A1538;}
.mk-book.t2 .mb-photo{border-color:#C49A3C;}
.mk-book.t3{background:linear-gradient(160deg,#F2A4B8 0%,#E87795 55%,#D9446E 100%);}
.mk-book.t3 .mb-band{background:rgba(255,255,255,.94);color:#C9244F;}
.mk-book.t3 .mb-title{color:#fff;text-shadow:0 1px 3px rgba(140,20,55,.4);}
.mk-book.t3 .mb-photo{border-color:#fff;}
.mk-book.t4{background:linear-gradient(160deg,#6E1030 0%,#4F081F 100%);}
.mk-book.t4 .mb-band{background:linear-gradient(105deg,#B8862B,#F2DFA7 50%,#C49A3C);color:#6B4A0C;}
.mk-book.t4 .mb-title{color:#F8E3C4;}
.mk-book.t4 .mb-photo{border-color:#C49A3C;}

/* ---- ビデオ形式（モニター＋再生UI） ---- */
.mk-video{width:100%;max-width:172px;display:flex;flex-direction:column;align-items:center;}
.mk-video .mv-frame{
  position:relative;width:100%;aspect-ratio:16/10.6;
  border:6px solid #2E2A2C;border-radius:9px;overflow:hidden;
  background:linear-gradient(120deg,#8A1538 0%,#5E0A26 100%);
  box-shadow:7px 10px 18px rgba(90,40,55,.38);
}
.mk-video .mv-band{
  position:absolute;top:0;left:0;right:0;z-index:3;
  background:linear-gradient(105deg,#B8862B,#F2DFA7 50%,#C49A3C);
  color:#6B4A0C;font-size:7.5px;font-weight:700;letter-spacing:.12em;
  text-align:center;padding:2px 2px;line-height:1.3;
}
.mk-video .mv-photo{
  position:absolute;right:0;top:0;bottom:0;width:52%;
  object-fit:cover;object-position:50% 10%;height:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);
  mask-image:linear-gradient(90deg,transparent 0,#000 22%);
}
.mk-video .mv-ttl{
  position:absolute;left:6px;top:50%;transform:translateY(-46%);z-index:3;
  width:52%;text-align:left;
  color:#fff;font-family:var(--serif);font-weight:900;
  font-size:9.5px;line-height:1.55;text-shadow:0 1px 3px rgba(60,5,25,.6);
}
.mk-video .mv-play{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.94);color:#C9244F;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;padding-left:2px;
  box-shadow:0 2px 6px rgba(40,5,20,.45);
}
.mk-video .mv-bar{
  position:absolute;left:0;right:0;bottom:0;height:5px;z-index:4;
  background:rgba(255,255,255,.28);
}
.mk-video .mv-bar::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:38%;
  background:#E0577E;
}
.mk-video .mv-bar::after{
  content:"";position:absolute;left:38%;top:50%;transform:translate(-50%,-50%);
  width:9px;height:9px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(40,5,20,.5);
}
.mk-video .mv-stand{width:24%;height:11px;background:linear-gradient(180deg,#3A3438,#242022);}
.mk-video .mv-base{width:46%;height:6px;border-radius:3px;background:#2E2A2C;}

/* ---- オーディオ形式（音声プレイヤー） ---- */
.mk-audio{
  position:relative;width:132px;height:196px;flex-shrink:0;
  border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding:10px 8px 12px;
  box-shadow:7px 10px 18px rgba(90,40,55,.38);
}
.mk-audio.a1{background:linear-gradient(165deg,#6E1030 0%,#4F081F 100%);}
.mk-audio.a2{background:linear-gradient(165deg,#FFFDF8 0%,#F7EBD2 100%);border:1px solid #E3C97E;}
.mk-audio .ma-tag{
  font-size:7.5px;font-weight:700;letter-spacing:.26em;line-height:1;margin-bottom:7px;
}
.mk-audio.a1 .ma-tag{color:#E9CC82;}
.mk-audio.a2 .ma-tag{color:#9C6A14;}
.mk-audio .ma-photo{
  width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:50% 14%;
  border:3px solid;flex-shrink:0;
}
.mk-audio.a1 .ma-photo{border-color:#E3C26B;}
.mk-audio.a2 .ma-photo{border-color:#C49A3C;}
.mk-audio .ma-ttl{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:9.5px;line-height:1.55;
  text-align:center;padding:4px 2px;
}
.mk-audio.a1 .ma-ttl{color:#fff;}
.mk-audio.a2 .ma-ttl{color:#8A1538;}
/* 波形 */
.mk-audio .ma-wave{
  display:flex;align-items:flex-end;justify-content:center;gap:2.5px;
  height:22px;margin-bottom:7px;
}
.mk-audio .ma-wave i{width:3px;border-radius:2px;}
.mk-audio.a1 .ma-wave i{background:#E0577E;}
.mk-audio.a2 .ma-wave i{background:#D33667;}
.mk-audio .ma-wave i:nth-child(1){height:30%;}
.mk-audio .ma-wave i:nth-child(2){height:55%;}
.mk-audio .ma-wave i:nth-child(3){height:90%;}
.mk-audio .ma-wave i:nth-child(4){height:48%;}
.mk-audio .ma-wave i:nth-child(5){height:75%;}
.mk-audio .ma-wave i:nth-child(6){height:100%;}
.mk-audio .ma-wave i:nth-child(7){height:58%;}
.mk-audio .ma-wave i:nth-child(8){height:82%;}
.mk-audio .ma-wave i:nth-child(9){height:38%;}
.mk-audio .ma-wave i:nth-child(10){height:64%;}
.mk-audio .ma-wave i:nth-child(11){height:26%;}
/* 再生コントロール */
.mk-audio .ma-ctrl{display:flex;align-items:center;justify-content:center;gap:12px;}
.mk-audio .ma-ctrl .s{font-size:9px;font-style:normal;letter-spacing:-.14em;}
.mk-audio.a1 .ma-ctrl .s{color:#F2C9D6;}
.mk-audio.a2 .ma-ctrl .s{color:#B8862B;}
.mk-audio .ma-ctrl .p{
  width:25px;height:25px;border-radius:50%;font-style:normal;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;padding-left:2px;
}
.mk-audio.a1 .ma-ctrl .p{background:#fff;color:#8A1538;}
.mk-audio.a2 .ma-ctrl .p{background:linear-gradient(135deg,#D33667,#C9244F);color:#fff;}

/* ---- ラベル ---- */
.bk-label{font-size:11.5px;font-weight:700;text-align:center;line-height:1.5;color:var(--ink);}
.bk-label b{color:var(--main);}

/* さらに20大特典 */
.more-box{
  width:min(94%,640px);margin:40px auto 28px;position:relative;text-align:center;
  background:linear-gradient(135deg,#C9244F 0%,#E0577E 50%,#C9244F 100%);
  color:#fff;padding:34px 16px 26px;border-radius:6px;
  box-shadow:0 6px 16px rgba(150,20,60,.3);
}
.more-box .more-tag{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  background:#fff;color:var(--main);font-family:var(--serif);font-weight:700;
  font-size:clamp(15px,4vw,20px);letter-spacing:.2em;padding:4px 26px;
  box-shadow:0 3px 8px rgba(120,20,50,.25);
}
.more-box .l1{font-family:var(--serif);font-weight:700;font-size:clamp(20px,5.6vw,30px);letter-spacing:.08em;}
.more-box .l2{font-family:var(--serif);font-weight:900;font-size:clamp(30px,8.4vw,46px);line-height:1.3;letter-spacing:.04em;}
.more-box .l2 small{font-size:.55em;font-weight:700;}
.present-grid{
  width:min(94%,640px);margin:0 auto;display:grid;
  grid-template-columns:repeat(3,1fr);gap:34px 12px;
}
@media(max-width:430px){.present-grid{grid-template-columns:repeat(2,1fr);}}
.pr-num{
  position:relative;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#F8E9BE 0%,#E3C26B 45%,#B8862B 100%);
  box-shadow:0 3px 8px rgba(140,100,30,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-bottom:-40px;z-index:7;
}
.pr-num .pr-p{font-family:var(--script);font-size:15px;color:#7E5A12;line-height:1;margin-top:-4px;}
.pr-num .pr-n{font-family:var(--serif);font-weight:900;font-size:24px;color:#6B4A0C;line-height:1;}

.pr-cap{font-size:11px;font-weight:700;color:var(--main);line-height:1.5;text-align:center;}
.pr-ttl{font-size:12px;font-weight:900;color:var(--ink);line-height:1.5;text-align:center;margin-top:-5px;}

/* ============================================================
   3. 悩みセクション（ダーク）
============================================================ */
.nayami{
  position:relative;color:#fff;
  background:linear-gradient(180deg,#3B3B3D 0%,#2E2E30 100%);
  padding-bottom:0;overflow:hidden;
}
.nayami-img{width:100%;height:auto;display:block;}
.nayami .stripe{
  height:26px;
  background:repeating-linear-gradient(-45deg,#222 0 12px,#4A4A4C 12px 24px);
}
.nayami .stripe.btm{margin-top:34px;}
.nayami-head{
  text-align:center;font-family:var(--serif);font-weight:700;
  font-size:clamp(19px,5vw,30px);line-height:1.75;letter-spacing:.02em;
  padding:34px 4% 10px;position:relative;z-index:2;
}
.nayami-head .moyamoya{
  font-weight:900;font-size:1.18em;letter-spacing:.12em;
  text-shadow:0 0 8px rgba(255,255,255,.25);
}
.nayami-photo{
  position:relative;margin:6px 0 0;
}
.nayami-photo img{
  width:100%;filter:grayscale(1) contrast(1.05) brightness(.82);
}
